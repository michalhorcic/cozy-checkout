<h2 style="margin:25px 0 12px;padding-bottom:8px;border-bottom:2px solid #e5e7eb;color:#1f2937;font-size:18px;">Parkování a příjezd</h2>
<p>Najdete nás na adrese <strong>Jindřichův dům, Pec pod Sněžkou 24</strong> (<a href="https://mapy.cz/zakladni?q=Pec%20pod%20Sn%C4%9B%C5%BEkou%2024">zobrazit na mapy.cz</a>).</p>
<p>V létě je možné <strong>přijet autem až k chatě</strong>. Poplatek za parkování je <strong>200 Kč na týden</strong>.</p>
<div style="margin:20px 0;padding:15px 18px;background:#dbeafe;border-left:4px solid #3b82f6;border-radius:0 8px 8px 0;">
  <strong>Jak na to:</strong> Poplatek se platí u automatu dole v obci ještě před výjezdem k chatě. Lístek si nechte za sklem auta.
</div>
